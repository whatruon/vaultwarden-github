name: vaultwarden

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: vaultwarden
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh

      - name: Remove stale tailscale device
        run: |
          DEVICE_ID=$(curl -fsSL -u "${{ secrets.TS_API_KEY }}:" \
            "https://api.tailscale.com/api/v2/tailnet/${{ secrets.TS_TAILNET }}/devices" \
            | jq -r '.devices[] | select(.hostname=="vault") | .id')
          if [ -n "$DEVICE_ID" ]; then
            curl -fsSL -X DELETE -u "${{ secrets.TS_API_KEY }}:" \
              "https://api.tailscale.com/api/v2/device/$DEVICE_ID"
          fi

      - name: Tailscale up
        run: |
          sudo tailscale up \
            --hostname=vault \
            --auth-key=${{ secrets.TS_AUTHKEY }} \
            --advertise-exit-node \
            --ssh

      - name: Restore certs from cache
        id: cert-cache
        uses: actions/cache/restore@v4
        with:
          path: certs
          key: vaultwarden-cert-${{ secrets.TS_CERT_DOMAIN }}
          restore-keys: |
            vaultwarden-cert-${{ secrets.TS_CERT_DOMAIN }}-

      - name: Fetch TLS cert from tailscale (if needed)
        id: cert-fetch
        run: |
          mkdir -p certs
          if [ -f certs/cert.pem ] && openssl x509 -in certs/cert.pem -noout -checkend 2592000 >/dev/null 2>&1; then
            echo "Cached cert valid for 30+ days, skipping renewal"
          else
            sudo tailscale cert --cert-file certs/cert.pem --key-file certs/key.pem "${{ secrets.TS_CERT_DOMAIN }}"
            sudo chown -R $USER:$USER certs
          fi
          echo "cert-serial=$(openssl x509 -in certs/cert.pem -noout -serial 2>/dev/null | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Save certs to cache
        uses: actions/cache/save@v4
        with:
          path: certs
          key: vaultwarden-cert-${{ secrets.TS_CERT_DOMAIN }}-${{ steps.cert-fetch.outputs.cert-serial }}

      - name: Create network
        run: docker network create vaultwarden-net

      - name: Run vaultwarden
        run: |
          docker run -d --name vaultwarden \
            --network vaultwarden-net \
            -e DATABASE_URL="${{ secrets.VAULTWARDEN_DB_URL }}" \
            -e I_REALLY_WANT_VOLATILE_STORAGE="true" \
            vaultwarden/server:latest

      - name: Run caddy
        run: |
          docker run -d --name caddy \
            --network vaultwarden-net \
            -e TS_CERT_DOMAIN="${{ secrets.TS_CERT_DOMAIN }}" \
            -v "$PWD:/etc/caddy" \
            -p 443:443 \
            caddy:latest

      - name: Diagnose caddy routing
        run: |
          sleep 5
          echo "=== docker ps ==="
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          echo "=== caddy logs ==="
          docker logs caddy 2>&1 | tail -50
          echo "=== vaultwarden logs ==="
          docker logs vaultwarden 2>&1 | tail -20
          echo "=== caddy -> vaultwarden ==="
          docker exec caddy wget -qO- --timeout=5 http://vaultwarden:80/ 2>&1 | head -5 || echo "FAILED: caddy cannot reach vaultwarden"
          echo "=== tailscale ==="
          tailscale status
          tailscale ip -4

      - name: Keep runner alive
        run: |
          while true; do
            if ! docker inspect -f '{{.State.Running}}' vaultwarden 2>/dev/null | grep -q true; then
              docker start vaultwarden
            fi
            if ! docker inspect -f '{{.State.Running}}' caddy 2>/dev/null | grep -q true; then
              docker start caddy
            fi
            sleep 60
          done
